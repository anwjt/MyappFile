workflows:
  build-ipa:
    name: Build IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "AppFileManager.xcodeproj"
        XCODE_SCHEME: "AppFileManager"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "main"
    scripts:
      - name: Build app
        script: |
          cd $CM_BUILD_DIR
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGN_STYLE=Manual \
            ENABLE_BITCODE=NO \
            | tee build.log
          echo "EXIT: ${PIPESTATUS[0]}"

      - name: Package IPA
        script: |
          cd $CM_BUILD_DIR
          APP_PATH=$(find $HOME/Library/Developer/Xcode/DerivedData -name "AppFileManager.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found, searching..."
            find $HOME/Library -name "AppFileManager.app" 2>/dev/null
            find . -name "*.app" -type d 2>/dev/null
            exit 1
          fi
          echo "Found: $APP_PATH"
          ls -la "$APP_PATH/"

          rm -rf Payload packages
          mkdir -p Payload packages
          cp -R "$APP_PATH" Payload/AppFileManager.app
          cd Payload
          zip -r ../packages/AppFileManager.ipa AppFileManager.app
          cd ..
          rm -rf Payload
          echo "=== IPA size ==="
          ls -lh packages/

    artifacts:
      - packages/*.ipa
      - build.log
