workflows:
  build-ipa:
    name: Build IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "AppFileManager.xcodeproj"
        XCODE_SCHEME: "AppFileManager"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "main"
    scripts:
      - name: Build app
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGN_STYLE=Manual \
            ENABLE_BITCODE=NO \
            | tee build.log
          echo "Build completed successfully"

      - name: Package IPA
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          APP_PATH=$(find build -name "AppFileManager.app" -type d 2>/dev/null | grep -E 'Release|Debug|iphoneos' | head -1 || true)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found, searching..."
            find build -name "*.app" -type d 2>/dev/null || true
            exit 1
          fi
          echo "Found: $APP_PATH"
          ls -la "$APP_PATH/"

          rm -rf Payload packages
          mkdir -p Payload packages
          cp -R "$APP_PATH/" Payload/AppFileManager.app
          cd Payload
          zip -qr ../packages/AppFileManager.ipa AppFileManager.app
          cd ..
          rm -rf Payload
          echo "=== IPA size ==="
          ls -lh packages/

    artifacts:
      - packages/*.ipa
      - build.log
