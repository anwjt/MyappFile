name: Build Signed IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install certificate and provisioning profile
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROVISION_PROFILE: ${{ secrets.PROVISION_PROFILE }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          # Decode certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          
          # Import certificate into keychain
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          
          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISION_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/AppFileManager.mobileprovision

      - name: Build and Archive
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          xcodebuild archive \
            -project AppFileManager.xcodeproj \
            -scheme AppFileManager \
            -archivePath build/AppFileManager.xcarchive \
            -destination "generic/platform=iOS" \
            -configuration Release \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="AppFileManager"

      - name: Export IPA
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          # Create ExportOptions.plist dynamically
          cat > ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/AppFileManager.xcarchive \
            -exportPath build/exported \
            -exportOptionsPlist ExportOptions.plist

      - name: Find and upload IPA
        run: |
          IPA_PATH=$(find build/exported -name "*.ipa" | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: IPA not found"
            find build/exported -type f
            exit 1
          fi
          mkdir -p packages
          cp "$IPA_PATH" packages/AppFileManager.ipa
          ls -la packages/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppFileManager-signed-ipa
          path: packages/*.ipa

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.ipa
          name: "AppFileManager Signed ${{ github.ref_name }}"
          tag_name: "signed-${{ github.run_number }}"
          draft: false
          prerelease: true
