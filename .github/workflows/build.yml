name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build AppFileManager IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project AppFileManager.xcodeproj \
            -scheme AppFileManager \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" \
            -configuration Release

      - name: Create IPA
        run: |
          mkdir -p Payload packages
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "AppFileManager.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find AppFileManager.app"
            exit 1
          fi
          cp -R "$APP_PATH" Payload/
          cd Payload
          zip -r ../packages/AppFileManager.ipa AppFileManager.app
          cd ..
          rm -rf Payload
          ls -la packages/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AppFileManager-ipa
          path: packages/*.ipa

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.ipa
          name: "AppFileManager ${{ github.ref_name }}-${{ github.sha }}"
          tag_name: "build-${{ github.run_number }}"
          draft: false
          prerelease: true
